"546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="76" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="76" dy="0">USER ACTION</tspan></text><text x="76" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="76" dy="0">Student chooses Test B and clicks</tspan><tspan x="76" dy="23">Assess supplied evidence.</tspan></text><text x="76" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="76" dy="0">SYSTEM RESPONSE</tspan></text><text x="76" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="76" dy="0">A predefined non-support explanation</tspan><tspan x="76" dy="22">is shown.</tspan></text><text x="64" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="64" dy="0">Assessment is SIMULATED, not a live API</tspan><tspan x="64" dy="19">response.</tspan></text><line x1="435" y1="494" x2="454" y2="494" stroke="#7F91A6" stroke-width="3" marker-end="url(#arrow)" /><rect x="456" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="458" y="166" width="392" height="79" rx="18" fill="#DDEFE6" stroke="#DDEFE6" stroke-width="0" /><text x="480" y="198" fill="#48647C" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="480" dy="0">STEP 2</tspan></text><text x="480" y="225" fill="#15334D" font-size="21" font-weight="700" font-family="Arial, sans-serif"><tspan x="480" dy="0">Report a mismatch</tspan></text><rect x="480" y="276" width="348" height="239" rx="11" fill="#F8FAFD" stroke="#DCE4EE" stroke-width="1" /><text x="498" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="498" dy="0">Your decision and control</tspan></text><text x="498" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="498" dy="0">Report mismatch</tspan></text><text x="498" y="387" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="498" dy="0">Optional reason / correction</tspan></text><rect x="480" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="496" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="496" dy="0">USER ACTION</tspan></text><text x="496" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="496" dy="0">Student enters a reason and</tspan><tspan x="496" dy="23">reports mismatch.</tspan></text><text x="496" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="496" dy="0">SYSTEM RESPONSE</tspan></text><text x="496" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="496" dy="0">Page records feedback in current-case</tspan><tspan x="496" dy="22">action history.</tspan></text><text x="484" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="484" dy="0">Browser memory only; no AI retraining.</tspan></text><line x1="855" y1="494" x2="874" y2="494" stroke="#7F91A6" stroke-width="3" marker-end="url(#arrow)" /><rect x="876" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="878" y="166" width="392" height="79" rx="18" fill="#F6E9D3" stroke="#F6E9D3" stroke-width="0" /><text x="900" y="198" fill="#48647C" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="900" dy="0">STEP 3</tspan></text><text x="900" y="225" fill="#15334D" font-size="21" font-weight="700" font-family="Arial, sans-serif"><tspan x="900" dy="0">Exclude candidate</tspan></text><rect x="900" y="276" width="348" height="239" rx="11" fill="#F8FAFD" stroke="#DCE4EE" stroke-width="1" /><text x="918" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="918" dy="0">Exclude candidate</tspan></text><text x="918" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">Candidate: excluded</tspan></text><text x="918" y="387" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">Other decision controls disabled</tspan></text><rect x="900" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="916" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="916" dy="0">USER ACTION</tspan></text><text x="916" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="916" dy="0">Student clicks Exclude candidate.</tspan></text><text x="916" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="916" dy="0">SYSTEM RESPONSE</tspan></text><text x="916" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="916" dy="0">Interface blocks further decisions</tspan><tspan x="916" dy="22">for excluded candidate.</tspan></text><text x="904" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="904" dy="0">Local state only; no OpenAlex change.</tspan></text><line x1="1275" y1="494" x2="1294" y2="494" stroke="#7F91A6" stroke-width="3" marker-end="url(#arrow)" /><rect x="1296" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="1298" y="166" width="392" height="79" rx="18" fill="#EDE3F4" stroke="#EDE3F4" stroke-width="0" /><text x="1320" y="198" fill="#48647C" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="1320" dy="0">STEP 4</tspan></text><text x="1320" y="225" fill="#15334D" font-size="21" font-weight="700" font-family="Arial, sans-serif"><tspan x="1320" dy="0">Restore &amp; continue</tspan></text><rect x="1320" y="276" width="348" height="239" rx="11" fill="#F8FAFD" stroke="#DCE4EE" stroke-width="1" /><text x="1338" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="1338" dy="0">Restore candidate</tspan></text><text x="1338" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="1338" dy="0">Candidate restored</tspan></text><text x="1338" y="387" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="1338" dy="0">Controls available again</tspan></text><rect x="1320" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="1336" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="1336" dy="0">USER ACTION</tspan></text><text x="1336" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="1336" dy="0">Student clicks Restore candidate.</tspan></text><text x="1336" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="1336" dy="0">SYSTEM RESPONSE</tspan></text><text x="1336" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="1336" dy="0">Interface restores actions; local</tspan><tspan x="1336" dy="22">history records steps.</tspan></text><text x="1324" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="1324" dy="0">Reset on page reload; separate from Live mode.</tspan></text><rect x="36" y="835" width="1628" height="60" rx="12" fill="#EDF3F8" stroke="#D4E0EC" stroke-width="1" /><text x="58" y="862" fill="#324D66" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="58" dy="0">Human-control buttons are implemented in DEMO mode, not in the current Live analysis panel.</tspan></text></svg>