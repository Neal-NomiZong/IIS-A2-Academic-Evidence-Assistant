<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 930" width="1700" height="930" role="img" aria-label="Live scenario 2 — Over-generalised claim"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7589A4" /></marker></defs><rect x="0" y="0" width="1700" height="930" rx="0" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0" /><text x="52" y="62" fill="#102943" font-size="37" font-weight="700" font-family="Arial, sans-serif"><tspan x="52" dy="0">Live scenario 2 — Over-generalised claim</tspan></text><text x="54" y="101" fill="#57708B" font-size="17" font-weight="400" font-family="Arial, sans-serif"><tspan x="54" dy="0">V0.7 live-mode illustration · uses user-observed V0.6 regression result; re-test in V0.7 remains pending</tspan></text><rect x="36" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="38" y="166" width="392" height="79" rx="18" fill="#D8E9F8" stroke="#D8E9F8" stroke-width="0" /><text x="60" y="198" fill="#48647C" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="60" dy="0">STEP 1</tspan></text><text x="60" y="225" fill="#15334D" font-size="21" font-weight="700" font-family="Arial, sans-serif"><tspan x="60" dy="0">Keep the same paper</tspan></text><rect x="60" y="276" width="348" height="239" rx="11" fill="#F8FAFD" stroke="#DCE4EE" stroke-width="1" /><text x="78" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="78" dy="0">Selected: Cao et al.</tspan></text><text x="78" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="78" dy="0">Topic: AI uncertainty and user</tspan><tspan x="78" dy="22">reliance</tspan></text><text x="78" y="409" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="78" dy="0">Abstract available</tspan></text><rect x="60" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="76" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="76" dy="0">USER ACTION</tspan></text><text x="76" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="76" dy="0">Student keeps the same paper</tspan><tspan x="76" dy="23">selected.</tspan></text><text x="76" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="76" dy="0">SYSTEM RESPONSE</tspan></text><text x="76" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="76" dy="0">Search result and source remain</tspan><tspan x="76" dy="22">available.</tspan></text><text x="64" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="64" dy="0">Changing only the claim isolates claim</tspan><tspan x="64" dy="19">sensitivity.</tspan></text><line x1="435" y1="494" x2="454" y2="494" stroke="#7F91A6" stroke-width="3" marker-end="url(#arrow)" /><rect x="456" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="458" y="166" width="392" height="79" rx="18" fill="#DDEFE6" stroke="#DDEFE6" stroke-width="0" /><text x="480" y="198" fill="#48647C" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="480" dy="0">STEP 2</tspan></text><text x="480" y="225" fill="#15334D" font-size="21" font-weight="700" font-family="Arial, sans-serif"><tspan x="480" dy="0">Strengthen the claim</tspan></text><rect x="480" y="276" width="348" height="239" rx="11" fill="#F8FAFD" stroke="#DCE4EE" stroke-width="1" /><text x="498" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="498" dy="0">Research Claim</tspan></text><text x="498" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="498" dy="0">Uncertainty always reduces</tspan><tspan x="498" dy="22">reliance</tspan></text><text x="498" y="409" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="498" dy="0">regardless of task or user</tspan></text><rect x="480" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="496" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="496" dy="0">USER ACTION</tspan></text><text x="496" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="496" dy="0">Student replaces the claim with</tspan><tspan x="496" dy="23">absolute wording.</tspan></text><text x="496" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="496" dy="0">SYSTEM RESPONSE</tspan></text><text x="496" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="496" dy="0">The next click submits the new claim</tspan><tspan x="496" dy="22">with the selected ID.</tspan></text><text x="484" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="484" dy="0">Actual claim text editable in Live mode.</tspan></text><line x1="855" y1="494" x2="874" y2="494" stroke="#7F91A6" stroke-width="3" marker-end="url(#arrow)" /><rect x="876" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="878" y="166" width="392" height="79" rx="18" fill="#F6E9D3" stroke="#F6E9D3" stroke-width="0" /><text x="900" y="198" fill="#48647C" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="900" dy="0">STEP 3</tspan></text><text x="900" y="225" fill="#15334D" font-size="21" font-weight="700" font-family="Arial, sans-serif"><tspan x="900" dy="0">Assess scope and limits</tspan></text><rect x="900" y="276" width="348" height="239" rx="11" fill="#F8FAFD" stroke="#DCE4EE" stroke-width="1" /><text x="918" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="918" dy="0">Provisional judgement</tspan></text><text x="918" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">Illustrative: potential</tspan><tspan x="918" dy="22">contradiction</tspan></text><text x="918" y="409" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">Task-specific evidence</tspan></text><text x="918" y="441" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">Demographics affect reliance</tspan></text><rect x="900" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="916" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="916" dy="0">USER ACTION</tspan></text><text x="916" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="916" dy="0">Student requests another</tspan><tspan x="916" dy="23">assessment.</tspan></text><text x="916" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="916" dy="0">SYSTEM RESPONSE</tspan></text><text x="916" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="916" dy="0">Model can explain why a universal</tspan><tspan x="916" dy="22">claim exceeds the abstract.</tspan></text><text x="904" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="904" dy="0">Outcome observed in V0.6, not yet validated in</tspan><tspan x="904" dy="19">V0.7.</tspan></text><line x1="1275" y1="494" x2="1294" y2="494" stroke="#7F91A6" stroke-width="3" marker-end="url(#arrow)" /><rect x="1296" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="1298" y="166" width="392" height="79" rx="18" fill="#EDE3F4" stroke="#EDE3F4" stroke-width="0" /><text x="1320" y="198" fill="#48647C" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="1320" dy="0">STEP 4</tspan></text><text x="1320" y="225" fill="#15334D" font-size="21" font-weight="700" font-family="Arial, sans-serif"><tspan x="1320" dy="0">Re-evaluate claim</tspan></text><rect x="1320" y="276" width="348" height="239" rx="11" fill="#F8FAFD" stroke="#DCE4EE" stroke-width="1" /><text x="1338" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="1338" dy="0">Manual review</tspan></text><text x="1338" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="1338" dy="0">Potential contradiction is not</tspan><tspan x="1338" dy="22">proof</tspan></text><text x="1338" y="409" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="1338" dy="0">that every context has the</tspan><tspan x="1338" dy="22">opposite effect.</tspan></text><rect x="1320" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="1336" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="1336" dy="0">USER ACTION</tspan></text><text x="1336" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="1336" dy="0">Student checks abstract; narrows</tspan><tspan x="1336" dy="23">or revises the claim.</tspan></text><text x="1336" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="1336" dy="0">SYSTEM RESPONSE</tspan></text><text x="1336" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="1336" dy="0">The app permits claim editing and</tspan><tspan x="1336" dy="22">re-analysis.</tspan></text><text x="1324" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="1324" dy="0">No automated scientific truth check.</tspan></text><rect x="36" y="835" width="1628" height="60" rx="12" fill="#EDF3F8" stroke="#D4E0EC" stroke-width="1" /><text x="58" y="862" fill="#324D66" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="58" dy="0">This storyboard illustrates a supported workflow; the specific V0.7 verdict must be tested rather than assumed.</tspan></text></svg>