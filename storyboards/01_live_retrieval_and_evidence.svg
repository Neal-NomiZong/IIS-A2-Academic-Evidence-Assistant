-width="1" /><text x="918" y="311" fill="#1B466A" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="918" dy="0">Provisional LLM analysis</tspan></text><text x="918" y="355" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">verdict: potential support</tspan></text><text x="918" y="387" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">evidence_basis + limitations</tspan></text><text x="918" y="419" fill="#304860" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="918" dy="0">uncertainty + suggested next step</tspan></text><rect x="900" y="546" width="348" height="180" rx="10" fill="#F3F7FB" stroke="#E4EBF3" stroke-width="1" /><text x="916" y="574" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="916" dy="0">USER ACTION</tspan></text><text x="916" y="605" fill="#183754" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="916" dy="0">Student clicks Analyse selected</tspan><tspan x="916" dy="23">abstract with AI.</tspan></text><text x="916" y="665" fill="#5A7896" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="916" dy="0">SYSTEM RESPONSE</tspan></text><text x="916" y="693" fill="#305269" font-size="15" font-weight="400" font-family="Arial, sans-serif"><tspan x="916" dy="0">Python fetches abstract by work ID,</tspan><tspan x="916" dy="22">calls LLM, returns six fields.</tspan></text><text x="904" y="768" fill="#7A6077" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="904" dy="0">Real model inference; provisional, not</tspan><tspan x="904" dy="19">verified truth.</tspan></text><line x1="1275" y1="494" x2="1294" y2="494" stroke="#7F91A6" stroke-width="3" marker-end="url(#arrow)" /><rect x="1296" y="164" width="396" height="638" rx="20" fill="#FFFFFF" stroke="#D4DDE9" stroke-width="2" /><rect x="1298" y="166"