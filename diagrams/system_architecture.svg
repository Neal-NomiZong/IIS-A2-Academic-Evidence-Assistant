<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-label="Academic Evidence Assistant — V0.7 architecture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7589A4" /></marker></defs><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0" /><text x="52" y="62" fill="#102943" font-size="37" font-weight="700" font-family="Arial, sans-serif"><tspan x="52" dy="0">Academic Evidence Assistant — V0.7 architecture</tspan></text><text x="54" y="101" fill="#57708B" font-size="17" font-weight="400" font-family="Arial, sans-serif"><tspan x="54" dy="0">Built components and external services | data/control flows | modes kept separate</tspan></text><rect x="42" y="134" width="1515" height="595" rx="22" fill="#EFF6FC" stroke="#BDD3E8" stroke-width="2" /><text x="70" y="176" fill="#155383" font-size="22" font-weight="700" font-family="Arial, sans-serif"><tspan x="70" dy="0">LIVE MODE — real retrieval, LLM inference and quote verification</tspan></text><rect x="70" y="214" width="280" height="140" rx="14" fill="white" stroke="#86B4D7" stroke-width="2" /><text x="88" y="244" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="88" dy="0">Browser: Live UI</tspan></text><text x="88" y="272" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="88" dy="0">Enter claim, search papers,</tspan><tspan x="88" dy="19">select a work and inspect</tspan><tspan x="88" dy="19">results.</tspan></text><text x="88" y="340" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="88" dy="0">IMPLEMENTED · HTML / JS</tspan></text><rect x="450" y="214" width="310" height="140" rx="14" fill="white" stroke="#86B4D7" stroke-width="2" /><text x="468" y="244" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="468" dy="0">Python backend</tspan></text><text x="468" y="272" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="468" dy="0">Serves /api/search and</tspan><tspan x="468" dy="19">/api/analyze; validates input and</tspan><tspan x="468" dy="19">work ID.</tspan></text><text x="468" y="340" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="468" dy="0">IMPLEMENTED · localhost:8765</tspan></text><rect x="935" y="214" width="300" height="140" rx="14" fill="#E5F4EA" stroke="#96C9AA" stroke-width="2" /><text x="953" y="244" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="953" dy="0">OpenAlex API</tspan></text><text x="953" y="272" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="953" dy="0">Returns search metadata and a</tspan><tspan x="953" dy="19">freshly fetched abstract by ID.</tspan></text><text x="953" y="340" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="953" dy="0">EXTERNAL · real metadata</tspan></text><line x1="350" y1="283" x2="450" y2="283" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><text x="365" y="269" fill="#50687E" font-size="13" font-weight="700" font-family="Arial, sans-serif"><tspan x="365" dy="0">HTTP</tspan></text><line x1="760" y1="253" x2="935" y2="253" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><text x="801" y="240" fill="#50687E" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="801" dy="0">Search / ID</tspan></text><line x1="935" y1="319" x2="760" y2="319" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><text x="808" y="341" fill="#50687E" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="808" dy="0">Metadata</tspan></text><rect x="1215" y="438" width="306" height="144" rx="14" fill="#F5ECDB" stroke="#DCC6A0" stroke-width="2" /><text x="1233" y="468" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="1233" dy="0">OpenAI API</tspan></text><text x="1233" y="496" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="1233" dy="0">Receives the claim and abstract;</tspan><tspan x="1233" dy="19">generates six fields plus up to</tspan><tspan x="1233" dy="19">three quotes.</tspan></text><text x="1233" y="568" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="1233" dy="0">EXTERNAL · real LLM</tspan></text><polyline points="700,354 700,399 1370,399 1370,438" fill="none" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><text x="900" y="390" fill="#50687E" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="900" dy="0">Claim + freshly retrieved abstract</tspan></text><rect x="450" y="438" width="442" height="144" rx="14" fill="#FFFFFF" stroke="#82A9C9" stroke-width="2" /><text x="468" y="468" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="468" dy="0">Backend quote verification</tspan></text><text x="468" y="496" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="468" dy="0">Checks exact substrings in the fetched abstract;</tspan><tspan x="468" dy="19">records matched or not found.</tspan></text><text x="468" y="568" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="468" dy="0">IMPLEMENTED · not truth checking</tspan></text><rect x="70" y="438" width="280" height="144" rx="14" fill="#FFFFFF" stroke="#82A9C9" stroke-width="2" /><text x="88" y="468" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="88" dy="0">Browser results</tspan></text><text x="88" y="496" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="88" dy="0">Shows six fields, trace flags,</tspan><tspan x="88" dy="19">abstract and source links.</tspan></text><text x="88" y="568" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="88" dy="0">IMPLEMENTED · provisional</tspan></text><line x1="1215" y1="507" x2="892" y2="507" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><text x="994" y="492" fill="#50687E" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="994" dy="0">JSON + quotes</tspan></text><line x1="450" y1="507" x2="350" y2="507" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><text x="366" y="492" fill="#50687E" font-size="13" font-weight="400" font-family="Arial, sans-serif"><tspan x="366" dy="0">Result</tspan></text><rect x="70" y="627" width="595" height="88" rx="14" fill="#FFF" stroke="#A4B6CC" stroke-width="2" /><text x="88" y="657" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="88" dy="0">Student reviews evidence</tspan></text><text x="88" y="685" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="88" dy="0">Checks whether a matched quote really supports the claim.</tspan></text><line x1="205" y1="582" x2="205" y2="627" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><rect x="42" y="756" width="1515" height="218" rx="22" fill="#FFF7EE" stroke="#EDD3AF" stroke-width="2" /><text x="70" y="798" fill="#89551B" font-size="22" font-weight="700" font-family="Arial, sans-serif"><tspan x="70" dy="0">DEMO MODE — separate interactive simulation</tspan></text><rect x="70" y="830" width="424" height="126" rx="14" fill="#FFFFFF" stroke="#D6B989" stroke-width="2" /><text x="88" y="860" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="88" dy="0">Three predefined cases</tspan></text><text x="88" y="888" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="88" dy="0">Read-only fixture papers, claims and scripted</tspan><tspan x="88" dy="19">assessments.</tspan></text><text x="88" y="942" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="88" dy="0">SIMULATED judgements</tspan></text><rect x="588" y="830" width="432" height="126" rx="14" fill="#FFFFFF" stroke="#D6B989" stroke-width="2" /><text x="606" y="860" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="606" dy="0">Browser state and controls</tspan></text><text x="606" y="888" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="606" dy="0">Accept / Reject / Need verification; mismatch</tspan><tspan x="606" dy="19">report; exclude or restore.</tspan></text><text x="606" y="942" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="606" dy="0">IMPLEMENTED front-end only</tspan></text><rect x="1114" y="830" width="409" height="126" rx="14" fill="#FFFFFF" stroke="#D6B989" stroke-width="2" /><text x="1132" y="860" fill="#15334D" font-size="19" font-weight="700" font-family="Arial, sans-serif"><tspan x="1132" dy="0">Local action history</tspan></text><text x="1132" y="888" fill="#3D5166" font-size="14" font-weight="400" font-family="Arial, sans-serif"><tspan x="1132" dy="0">Records choices in page memory; reloading</tspan><tspan x="1132" dy="19">clears history.</tspan></text><text x="1132" y="942" fill="#586E83" font-size="12" font-weight="700" font-family="Arial, sans-serif"><tspan x="1132" dy="0">IMPLEMENTED · no persistence</tspan></text><line x1="494" y1="892" x2="588" y2="892" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><line x1="1020" y1="892" x2="1114" y2="892" stroke="#7589A4" stroke-width="3" marker-end="url(#arrow)" /><text x="64" y="1010" fill="#B14D4D" font-size="17" font-weight="700" font-family="Arial, sans-serif"><tspan x="64" dy="0">NOT IMPLEMENTED: full-text claim verification · calibrated confidence · persistent feedback · live-mode Accept/Reject controls</tspan></text><text x="64" y="1049" fill="#415970" font-size="16" font-weight="400" font-family="Arial, sans-serif"><tspan x="64" dy="0">A matched quotation confirms presence in the retrieved OpenAlex abstract — not scientific support or factual correctness.</tspan></text></svg>